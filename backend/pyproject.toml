[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
    "authlib>=1.3.2",          # cliente OAuth, valida el id_token de Google
    "httpx>=0.28.1",          # transporte HTTP que usa authlib para hablar con Google
    "pyjwt>=2.9.0",            # emitir/verificar el JWT propio
    "itsdangerous>=2.2.0",    # requerido por SessionMiddleware de Starlette
    "google-api-python-client>=2.150.0",   # cliente oficial de Google Classroom
    "google-auth>=2.36.0",                 # credenciales OAuth2 + refresco de token
    "cryptography>=44.0.0",                # cifra el refresh_token de Google en la DB
    "pillow>=11.0.0",                      # efecto duotono sobre el avatar de Google
    "numpy>=2.1.0",                        # operaciones vectorizadas del filtro CRT
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

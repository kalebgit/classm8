<div class="head">
  {{ mode() === 'pending' ? 'NO ENTREGADOS' : 'ENTREGADOS' }} —
  {{ view().length }} / {{ inModeCount() }}
</div>

<section class="filters">
  <label>
    Estado
    @if (mode() === 'pending') {
      <select [ngModel]="statusFilter()" (ngModelChange)="statusFilter.set($event)">
        <option value="all">Todos (no entregados)</option>
        <option value="overdue">Atrasados</option>
        <option value="soon">Próximos 7 días</option>
      </select>
    } @else {
      <select [ngModel]="statusFilter()" (ngModelChange)="statusFilter.set($event)">
        <option value="all">Todos (entregados)</option>
        <option value="ungraded">Sin calificar</option>
        <option value="graded">Calificados</option>
      </select>
    }
  </label>

  <label>
    Materia
    <select
      [ngModel]="courseId()"
      (ngModelChange)="courseId.set($event); onCourseChange()"
    >
      <option [ngValue]="0">Todas</option>
      @for (c of courseOptions(); track c.id) {
        <option [ngValue]="c.id">{{ c.name }}</option>
      }
    </select>
  </label>

  <label>
    Criterio de evaluación
    <select [ngModel]="categoryId()" (ngModelChange)="categoryId.set($event)">
      <option [ngValue]="0">Todos</option>
      @for (cat of categoryOptions(); track cat.id) {
        <option [ngValue]="cat.id">{{ cat.name }}</option>
      }
    </select>
  </label>

  <label>
    Ordenar
    <select [ngModel]="sort()" (ngModelChange)="sort.set($event)">
      <option value="due-asc">Fecha de entrega ↑</option>
      <option value="due-desc">Fecha de entrega ↓</option>
      <option value="grade-desc">Calificación ↓</option>
      <option value="name">Nombre A–Z</option>
    </select>
  </label>

  <button class="btn" type="button" (click)="clearFilters()">Limpiar</button>
</section>

@for (d of view(); track d.id) {
  <app-deliverable-card
    [deliverable]="d"
    (submit)="markSubmitted($event)"
    (grade)="openGrade($event)"
    (edit)="openEdit($event)"
    (remove)="removeDeliverable($event)"
  />
} @empty {
  <p class="empty">Nada coincide con los filtros.</p>
}

@if (editing(); as d) {
  <app-modal-shell title="Editar entregable" (close)="editing.set(null)">
    <app-deliverable-edit [deliverable]="d" (done)="onEdited()" (deleted)="onEdited()" />
  </app-modal-shell>
}

@if (grading(); as d) {
  <app-modal-shell title="Calificar" (close)="grading.set(null)">
    <app-grade-modal [deliverable]="d" (saved)="onGraded()" />
  </app-modal-shell>
}

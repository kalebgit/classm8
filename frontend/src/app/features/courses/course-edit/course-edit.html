<form [formGroup]="nameForm" (ngSubmit)="save()">
  <label>Nombre</label>
  <input formControlName="name" autocomplete="off" />
</form>

<label>Categorías existentes</label>
@for (c of categories(); track c.id) {
  <div class="cat-row">
    <input
      [value]="c.name"
      (input)="patchCat(c, 'name', $any($event.target).value)"
      autocomplete="off"
    />
    <input
      type="number"
      min="0"
      max="100"
      [value]="c.percentage"
      (input)="patchCat(c, 'percentage', $any($event.target).value)"
    />
    <button class="btn" type="button" (click)="saveCategory(c)" title="Guardar">✓</button>
    <button class="btn danger" type="button" (click)="removeCategory(c)" title="Eliminar">×</button>
  </div>
} @empty {
  <p class="dim">Sin categorías.</p>
}

<label>Agregar categoría</label>
<form class="cat-row new" [formGroup]="newCatForm" (ngSubmit)="addCategory()">
  <input formControlName="name" placeholder="Nombre" autocomplete="off" />
  <input formControlName="percentage" type="number" min="0" max="100" />
  <button class="btn" type="submit" [disabled]="busy()" title="Agregar">+</button>
  <span></span>
</form>

<p class="total" [class.bad]="total > 100">total: {{ total }}</p>

<app-status-line [status]="status()" />

<div class="foot">
  <button class="btn" type="button" [disabled]="busy()" (click)="save()">Guardar nombre y cerrar</button>
  <button class="btn danger" type="button" (click)="onDelete()">Eliminar materia</button>
</div>

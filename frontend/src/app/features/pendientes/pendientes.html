<div class="head">PENDIENTES — {{ pending().length }}</div>

@for (d of pending(); track d.id) {
  <app-deliverable-card
    [deliverable]="d"
    (submit)="markSubmitted($event)"
    (edit)="openEdit($event)"
    (remove)="removeDeliverable($event)"
  />
} @empty {
  <p class="empty">Sin pendientes. 🎉</p>
}

@if (editing(); as d) {
  <app-modal-shell title="Editar entregable" (close)="editing.set(null)">
    <app-deliverable-edit [deliverable]="d" (done)="onEdited()" (deleted)="onEdited()" />
  </app-modal-shell>
}

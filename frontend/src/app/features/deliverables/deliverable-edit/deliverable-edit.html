<form [formGroup]="form" (ngSubmit)="submit()">
  <label>Nombre</label>
  <input formControlName="name" autocomplete="off" />

  <label>Criterio de evaluación</label>
  <select formControlName="category_id">
    <option [ngValue]="0">—</option>
    @for (c of categories(); track c.id) {
      <option [ngValue]="c.id">{{ c.name }} ({{ c.percentage }}%)</option>
    }
  </select>

  <label>Fecha de entrega</label>
  <input type="datetime-local" formControlName="due_date" />

  <label class="check">
    <input type="checkbox" formControlName="submitted" />
    Entregado
  </label>

  @if (gradeEnabled) {
    <label>Calificación (0–150, sobre 100)</label>
    <input type="number" formControlName="grade" min="0" max="150" />
  }

  <app-status-line [status]="status()" />

  <div class="row-actions">
    <button class="btn" type="submit" [disabled]="busy()">Guardar</button>
    <button class="btn danger" type="button" (click)="onDelete()">Eliminar</button>
  </div>
</form>

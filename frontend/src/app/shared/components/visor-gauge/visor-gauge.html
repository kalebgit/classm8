<svg
  viewBox="0 0 44 44"
  class="visor"
  [class.sm]="size() === 'sm'"
  [class.lg]="size() === 'lg'"
  [style.--visor-color]="color()"
  shape-rendering="crispEdges"
>
  <!-- recorte circular del cristal -->
  <clipPath id="glass"><circle cx="22" cy="22" r="18" /></clipPath>

  <!-- fondo oscuro del visor -->
  <circle class="pane" cx="22" cy="22" r="18" />

  <!-- líquido: rectángulo que sube desde abajo -->
  <g clip-path="url(#glass)">
    <rect
      class="liquid"
      x="0"
      [attr.y]="levelY()"
      width="44"
      [attr.height]="44 - levelY() + 2"
    />
    <!-- brillo de la superficie -->
    <rect class="surface" x="0" [attr.y]="levelY()" width="44" height="1" />
  </g>

  <!-- marco del visor + remaches (estilo casco de buzo) -->
  <circle class="frame" cx="22" cy="22" r="18" />
  <circle class="frame-outer" cx="22" cy="22" r="21" />
  @for (r of [0, 45, 90, 135, 180, 225, 270, 315]; track r) {
    <circle
      class="rivet"
      [attr.cx]="22 + 19.5 * cos(r)"
      [attr.cy]="22 + 19.5 * sin(r)"
      r="1.3"
    />
  }

  <!-- número -->
  <text x="22" y="26" text-anchor="middle" class="num">{{ label() }}</text>
</svg>
